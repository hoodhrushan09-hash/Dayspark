<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dayspark-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7058" />
      <stop offset="50%" stop-color="#FF8D78" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
  </defs>

  <!-- High-fidelity squircle matching DaySpark logo token -->
  <rect width="64" height="64" rx="14" fill="url(#dayspark-gradient)" />

  <!-- Central spark sun core -->
  <circle cx="32" cy="32" r="8.5" fill="#FFFDF9" />

  <!-- 8 Cardinal and Diagonal Sun Rays -->
  <!-- Top / Bottom (Vertical) -->
  <line x1="32" y1="9" x2="32" y2="17.5" stroke="#FFFDF9" stroke-width="5" stroke-linecap="round" />
  <line x1="32" y1="46.5" x2="32" y2="55" stroke="#FFFDF9" stroke-width="5" stroke-linecap="round" />

  <!-- Left / Right (Horizontal) -->
  <line x1="9" y1="32" x2="17.5" y2="32" stroke="#FFFDF9" stroke-width="5" stroke-linecap="round" />
  <line x1="46.5" y1="32" x2="55" y2="32" stroke="#FFFDF9" stroke-width="5" stroke-linecap="round" />

  <!-- Diagonals -->
  <line x1="15.8" y1="15.8" x2="21.8" y2="21.8" stroke="#FFFDF9" stroke-width="4.8" stroke-linecap="round" />
  <line x1="42.2" y1="42.2" x2="48.2" y2="48.2" stroke="#FFFDF9" stroke-width="4.8" stroke-linecap="round" />
  <line x1="15.8" y1="48.2" x2="21.8" y2="42.2" stroke="#FFFDF9" stroke-width="4.8" stroke-linecap="round" />
  <line x1="42.2" y1="21.8" x2="48.2" y2="15.8" stroke="#FFFDF9" stroke-width="4.8" stroke-linecap="round" />
</svg>
