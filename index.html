<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DaySpark</title>

    <!-- Meta Description & Identity -->
    <meta name="description" content="Make today count, your way. A personal productivity platform for daily planning, tasks, habits, goals, and focus." />
    <meta name="application-name" content="DaySpark" />
    <meta name="apple-mobile-web-app-title" content="DaySpark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Theme Color matching DaySpark coral brand and dark mode -->
    <meta name="theme-color" content="#FF7058" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161715" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FF7058" />

    <!-- Favicon & Icon links across devices and browsers -->
    <link rel="icon" type="image/png" sizes="512x512" href="/app-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Social Cards -->
    <meta property="og:site_name" content="DaySpark" />
    <meta property="og:title" content="DaySpark — Make today count, your way" />
    <meta property="og:description" content="Make today count, your way. A personal productivity platform for daily planning, tasks, habits, goals, and focus." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DaySpark — Make today count, your way" />
    <meta name="twitter:description" content="Make today count, your way. A personal productivity platform for daily planning, tasks, habits, goals, and focus." />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
